[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-status"
version = "0.1.3"
description = "Console monitor for Copilot and Codex usage limits"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ai-status = "ai_status:main"

[tool.setuptools]
py-modules = ["ai_status"]
