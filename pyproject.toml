[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-status"
version = "0.2.0"
description = "Console monitor for local command status output"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ai-status = "ai_status:main"

[tool.setuptools]
py-modules = ["ai_status"]
